[package]
name = "nullrouter-pxpipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PXPIPE token-saver install management, event stats, and the Node transform bridge"
repository.workspace = true

[lib]
name = "nullrouter_pxpipe"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `process` and `io-util` for the transform worker: a child Node process spoken to
# over a line-delimited pipe, with a timeout that can actually kill the work.
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
