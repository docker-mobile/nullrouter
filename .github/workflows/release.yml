name: Release

# Separate from the pull-request gate on purpose. CI answers "may this land?" on every push; this answers
# "what is this tag?" and produces artifacts, which is slower and should not sit between a change and its
# review.
on:
  push:
    tags: ['v*']
  # Runnable by hand so a release build can be exercised before a tag exists.
  workflow_dispatch:

permissions:
  # Needed only to attach artifacts to the release. Declared explicitly rather than inherited: a workflow
  # that can write to the repository is a much larger thing to trust than one that can publish a build.
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  binaries:
    name: Build and package the release binaries (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The two architectures GitHub hosts natively, which are also the two whose tests actually execute in
    # CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain named in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the WASM target for the dashboard bundle
        run: rustup target add wasm32-unknown-unknown
      - name: Install cmake, which libz-ng-sys builds with
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          # Registry only, not `target`: a release build should not inherit object files from an unrelated
          # run. The download cache is the part worth keeping.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build every service in release mode
        run: cargo build --release --workspace --exclude nullrouter-dashboard-wasm

      - name: Collect the binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the executables: `target/release` also holds `.d` dependency files and build scripts.
          # `nullrouter-dashboard-wasm` is skipped for the same reason the build excludes it — it is a
          # wasm-only library, and a host-target artifact of it is a leftover rather than a deliverable.
          for binary in target/release/nullrouter-*; do
            case "$binary" in
              *.d | *dashboard-wasm) continue ;;
            esac
            if [ -f "$binary" ] && [ -x "$binary" ]; then
              # The triple goes in the filename. Both matrix jobs attach to one release and every binary
              # is called `nullrouter-<service>` on both, so without this the aarch64 upload would replace
              # the x86_64 one and the release would quietly offer ARM binaries labelled as generic.
              cp "$binary" "dist/$(basename "$binary")-${{ matrix.target }}"
            fi
          done
          ls -lh dist/

      - name: Record a checksum for each binary
        # So a downloader can verify what they got, and so a release's contents are pinned in its own log.
        # The filename carries the architecture: both matrix jobs attach to the same release, and a plain
        # `SHA256SUMS` from each would have one silently overwrite the other's.
        run: |
          set -euo pipefail
          cd dist
          sha256sum nullrouter-* > "SHA256SUMS-${{ matrix.target }}"
          cat "SHA256SUMS-${{ matrix.target }}"

      - name: Upload the binaries as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # The triple is in the name because `upload-artifact@v4` refuses a duplicate name, and both
          # matrix jobs would otherwise claim the same one.
          name: nullrouter-binaries-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

      - name: Attach the binaries to the release
        # Only for a tag. A manual run produces the artifact above and stops there, because there is no
        # release to attach to.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nullrouter-*
            dist/SHA256SUMS-${{ matrix.target }}
          generate_release_notes: true
