[package]
name = "nullrouter-dashboard-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lib]
name = "nullrouter_dashboard_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
leptos.workspace = true
leptos_router.workspace = true
nullrouter-contracts.workspace = true
nullrouter-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

# Enabled one at a time rather than through `all-components`, which does not compile. See the
# note on `leptos-shadcn-ui` in the workspace manifest.
[dependencies.leptos-shadcn-ui]
workspace = true
features = [
    "accordion",
    "alert",
    "avatar",
    "badge",
    "button",
    "card",
    "checkbox",
    "collapsible",
    "combobox",
    "dialog",
    "dropdown-menu",
    "input",
    "label",
    "pagination",
    "popover",
    "progress",
    "radio-group",
    "scroll-area",
    "separator",
    "sheet",
    "skeleton",
    "slider",
    "switch",
    "table",
    "tabs",
    "textarea",
    "toast",
    "toggle",
    "tooltip",
]

[dependencies.web-sys]
workspace = true
features = [
    "BroadcastChannel",
    "Clipboard",
    "Document",
    "Element",
    "EventSource",
    "EventTarget",
    "HtmlDocument",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MessageEvent",
    "Navigator",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Storage",
    "UrlSearchParams",
    "Window",
]

[lints]
workspace = true
