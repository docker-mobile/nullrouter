[package]
name = "nullrouter-auth"
version = "0.5.20"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Actix authentication and authorization microservice for nullrouter"

[lib]
name = "nullrouter_auth"
path = "src/lib.rs"

[[bin]]
name = "nullrouter-auth"
path = "src/main.rs"

[dependencies]
nullrouter-logship.workspace = true
actix-web = "4.11"
async-trait = "0.1"
base64 = "0.22"
bcrypt = "0.17"
# HTTP-Redirect binding requires a raw-deflated SAMLRequest.
flate2 = "1.1"
form_urlencoded = "1.2"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# RS256 verification of an OIDC id_token against the provider's JWKS. Pure Rust,
# so no system OpenSSL. Only public-key signature verification is used.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
# Authentication outcomes are audit events, not debug output. An enterprise has to be able to
# answer "who signed in, from where, and what failed" from the logs alone.
tracing.workspace = true

[dev-dependencies]
actix-rt.workspace = true
# Captures emitted records so the audit test asserts what a collector would receive, rather than
# that a `tracing!` line exists in the source.
tracing-subscriber.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
