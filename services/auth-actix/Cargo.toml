[package]
name = "nullrouter-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Actix authentication and authorization microservice for nullrouter"

[lib]
name = "nullrouter_auth"
path = "src/lib.rs"

[[bin]]
name = "nullrouter-auth"
path = "src/main.rs"

[dependencies]
nullrouter-logship.workspace = true
actix-web.workspace = true
async-trait = "0.1"
base64 = "0.22"
bcrypt = "0.17"
# HTTP-Redirect binding requires a raw-deflated SAMLRequest.
flate2 = "1.1"
form_urlencoded = "1.2"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# RS256 verification of an OIDC id_token against the provider's JWKS. Pure Rust,
# so no system OpenSSL. Only public-key signature verification is used.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2.6"
thiserror.workspace = true
# Authentication outcomes are audit events, not debug output. An enterprise has to be able to
# answer "who signed in, from where, and what failed" from the logs alone.
tracing.workspace = true

[dev-dependencies]
actix-rt.workspace = true
# Captures emitted records so the audit test asserts what a collector would receive, rather than
# that a `tracing!` line exists in the source.
tracing-subscriber.workspace = true

[lints]
workspace = true
