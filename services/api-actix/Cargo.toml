[package]
name = "nullrouter-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Actix Web API microservice for the nullrouter Rust port"
repository.workspace = true

[[bin]]
name = "nullrouter-api"
path = "src/main.rs"

[dependencies]
nullrouter-logship.workspace = true
# CA generation for the MITM control surface; the privileged install step lives in its binary.
nullrouter-mitm-helper.workspace = true
# geteuid, to skip a permission test that cannot hold for root.
libc.workspace = true
actix-web.workspace = true
futures-util.workspace = true
nullrouter-contracts.workspace = true
nullrouter-providers.workspace = true
nullrouter-procctl.workspace = true
nullrouter-pxpipe.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Codex, jcode, deepseek-tui and grok-build keep TOML configs.
toml.workspace = true
tracing.workspace = true
# The tunnel manager polls tailscaled's socket rather than sleeping a fixed interval.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
actix-rt.workspace = true
# The lifecycle suite posts to a real `HttpServer` over a socket, because `init_service` cannot
# exercise a shutdown handle. Integration tests do not inherit `[dependencies]`.
reqwest.workspace = true

[lints]
workspace = true
