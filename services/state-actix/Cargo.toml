[package]
name = "nullrouter-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Actix Web local state microservice for the nullrouter Rust port"
repository.workspace = true

[lib]
name = "nullrouter_state"
path = "src/lib.rs"

[[bin]]
name = "nullrouter-state"
path = "src/main.rs"

[dependencies]
nullrouter-logship.workspace = true
rusqlite.workspace = true
actix-web.workspace = true
getrandom = "0.3"
nullrouter-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
# A failed background flush means state is silently not being saved, which needs to be sayable.
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true
# For `umask`, so the permission test proves the code narrows the mode rather than
# inheriting a strict environment.
libc.workspace = true
actix-rt.workspace = true
tempfile.workspace = true

[lints]
workspace = true
